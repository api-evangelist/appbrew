name: Appbrew
description: 'Appbrew is an AI-powered Shopify mobile app builder that turns Shopify and Shopify
  Plus stores into fully native React Native iOS and Android apps for DTC and ecommerce brands,
  with no engineering headcount required. Merchants manage the app through a no-code dashboard,
  publish under their own Apple Developer and Google Play accounts, and grow with Milo (an AI
  growth agent that personalizes experiences and automates push-notification campaigns) and AI
  Concierge (a shopper-facing conversational assistant). The platform supports 100+ native
  integrations (Klaviyo, Attentive, LoyaltyLion, Yotpo, Recharge, Gorgias, AppsFlyer, Branch)
  and code externalization for custom functionality. Backed by Accel; sector: ecommerce.'
